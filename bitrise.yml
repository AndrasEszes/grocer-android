format_version: "23"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: android

meta:
  bitrise.io:
    stack: ubuntu-noble-24.04-bitrise-2025-android

workflows:
  ui_tests:
    summary: Runs the UI tests on an emulator and shows their screenshots and logs on the Tests tab.
    steps:
    - git-clone@8: {}
    - avd-manager@2:
        inputs:
        - api_level: "34"
        - abi: x86_64
        - tag: google_apis
    - wait-for-android-emulator@1: {}
    - gradle-runner@6:
        inputs:
        - gradle_task: connectedDebugAndroidTest
    - custom-test-results-export@1:
        inputs:
        - test_name: UI tests
        - base_path: app/build/outputs
        - search_pattern: "*/androidTest-results/connected/debug/TEST-*.xml"
    - git::https://github.com/bitrise-steplib/steps-deploy-to-bitrise-io.git@2.26.0: {}
